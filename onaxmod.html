<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONAXMOD</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 40px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f6fb; color: #111827; }
  .wrap { max-width: 480px; margin: 0 auto; text-align: center; }
  .avatar { width: 120px; height: 120px; margin: 8px auto 14px; border-radius: 50%; display: grid; place-items: center; font-size: 52px; font-weight: 800; color: #fff; background: linear-gradient(135deg, #6d28d9, #3b82f6); box-shadow: 0 10px 30px rgba(109, 40, 217, .3); }
  img.avatar { object-fit: cover; }
  .app { flex: none; width: 64px; height: 64px; border-radius: 16px; object-fit: cover; }
  .tag { display: inline-block; padding: 8px 22px; border: 2px solid #d1d5db; border-radius: 999px; font-weight: 800; letter-spacing: 3px; color: #4b5563; }
  .hi { margin: 14px 0 0; color: #4b5563; }
  h1 { margin: 4px 0 20px; font-size: 38px; }
  h1 i { display: inline-grid; place-items: center; width: 30px; height: 30px; margin-left: 6px; border-radius: 50%; background: #3b82f6; color: #fff; font-size: 18px; font-style: normal; vertical-align: middle; }
  .links { display: flex; gap: 10px; margin-bottom: 18px; }
  .links a { flex: 1; padding: 14px 8px; border-radius: 16px; background: #fff; border: 1px solid #e5e7eb; color: #111827; font-weight: 700; text-decoration: none; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); padding: 18px 4px; margin-bottom: 26px; border-radius: 20px; background: #fff; border: 1px solid #e5e7eb; }
  .stats b { display: block; font-size: 22px; color: #94a3b8; }
  .stats span { font-size: 13px; color: #374151; }
  .label { display: inline-block; margin-bottom: 14px; padding: 10px 22px; border: 2px solid #93c5fd; border-radius: 999px; font-weight: 800; letter-spacing: 2px; color: #3b82f6; }
  h2 { margin: 0 0 12px; text-align: left; font-size: 28px; }
  .card { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 22px; background: #fff; border: 1px solid #e5e7eb; text-align: left; }
  .card .info { flex: 1; }
  .card h3 { margin: 0 0 4px; font-size: 20px; }
  .card small { color: #6b7280; }
  .badge { display: inline-block; margin-top: 8px; padding: 4px 12px; border: 2px solid #22c55e; border-radius: 999px; color: #16a34a; font-size: 13px; font-weight: 700; }
  .dl { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 18px; background: #166534; color: #fff; font-size: 30px; text-decoration: none; }
</style>
</head>

<script>
  var fmt = function (n) { return Number(n || 0).toLocaleString('vi-VN'); };
  document.getElementById('year').textContent = new Date().getFullYear();
