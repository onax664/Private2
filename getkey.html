<head>
<meta charset="UTF-8">

<title>SeverKey Premium - GET KEY</title>
<style>
  :root {
    --violet-900: #2e1065;
    --violet-800: #4c1d95;
    --violet-700: #5b21b6;
    --violet-200: #ddd6fe;
    --violet-50: #f5f3ff;
    --text: #1e1033;
    --muted: #6b6485;
    --bg: #faf8ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px 48px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 52px; height: 52px; border-radius: 14px;
    background: var(--violet-800);
    display: grid; place-items: center;
  }
  .logo svg { width: 26px; height: 26px; fill: #fff; }
  .brand h2 { margin: 0; font-size: 20px; color: var(--violet-800); }
  .brand small { color: var(--muted); font-size: 14px; letter-spacing: .02em; }
  .shop-label {
    margin: 32px 0 0; display: flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 700; letter-spacing: .14em; color: var(--violet-700);
  }
  h1 {
    margin: 8px 0 12px; font-size: 38px; color: var(--violet-900);
    display: flex; align-items: center; gap: 10px;
  }
  h1 svg { width: 30px; height: 30px; fill: var(--violet-800); }
  .hint { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 18px; margin: 0 0 28px; }
  .hint b { color: var(--text); }
  .card {
    width: 280px; margin: 0 auto; padding: 20px 18px 18px;
    background: #fff; border: 2px solid var(--violet-200); border-radius: 22px;
    box-shadow: 0 8px 24px rgba(76, 29, 149, .12);
    text-align: center;
  }
  .card img { width: 88px; height: 88px; border-radius: 18px; object-fit: cover; }
  .card h3 { margin: 10px 0 6px; font-size: 22px; }
  .card .sub { color: var(--muted); font-size: 16px; margin-bottom: 16px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; height: 54px; border-radius: 12px; font-size: 18px; font-weight: 700;
    text-decoration: none; cursor: pointer; font-family: inherit;
  }
  .btn svg { width: 20px; height: 20px; fill: currentColor; }
  .btn.primary { background: var(--violet-800); color: #fff; border: 2px solid var(--violet-800); }
  .btn.primary:hover { background: var(--violet-700); }
  .btn.ghost { margin-top: 10px; background: #fff; color: var(--violet-800); border: 2px solid var(--violet-800); }
  .btn.ghost:hover { background: var(--violet-50); }
  .btn:focus-visible { outline: 3px solid #a78bfa; outline-offset: 2px; }
</style>
</head>
